name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Guard tests
        run: python3 tests/test_guard.py
      - name: Log summary tests
        run: python3 tests/test_log_summary.py
      - name: Install API dependencies
        run: pip install -r api/requirements.txt
      - name: API tests
        run: python3 -m pytest api/tests -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f api/Dockerfile -t incident-triage-api .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 -e TRIAGE_API_KEYS="viewer:ci-viewer-key" incident-triage-api
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/v1/incidents -H "X-API-Key: ci-viewer-key"
          docker rm -f api
